[project]
name = "class04-sim2real-gap-standalone"
version = "0.1.0"
description = "Standalone held-out replay and analysis for ROB7103 Class 04"
requires-python = ">=3.11,<3.14"
dependencies = ["mujoco>=3.3,<4", "numpy>=1.26,<3", "pandas>=2.2,<4", "pyarrow>=18,<24", "matplotlib>=3.8,<4", "dynamixel-sdk>=3.7,<4", "PyQt6>=6.7,<7"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
