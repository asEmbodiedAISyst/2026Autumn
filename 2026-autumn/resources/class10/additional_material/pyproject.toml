[project]
name = "rebot-pusher"
version = "0.1.0"
description = "ROB7103/8103 Classes 10-11: the reBot Arm B601-RS with the pusher tool: handheld data collection, phone teleoperation of the physical arm, LeRobot datasets, training and evaluation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.0",
    "numpy<2.3",
    "mujoco>=3.3",
    "gymnasium>=1.3",
    "scipy>=1.14",
    "pillow>=10",
    "asmagic>=0.1.4",
    "pyzmq>=25",
    "protobuf>=4",
]

[dependency-groups]
# LeRobot: dataset recording, training and evaluation (installs torch)
lerobot = ["lerobot[core-scripts,training,diffusion,smolvla]==0.6.1"]
# Physical arm: the Seeed LeRobot follower plugin (motorbridge over SocketCAN)
real = ["lerobot-robot-seeed-b601>=1.0.5"]
dev = ["pytest>=8"]

[tool.uv]
package = false
default-groups = ["lerobot", "dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
