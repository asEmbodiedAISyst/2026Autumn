[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "in-hand-rotation-mjlab"
version = "0.1.0"
description = "In-hand cube rotation task using LEAP hand in MuJoCo with mjlab"
requires-python = ">=3.10,<3.11"
dependencies = [
  "mjlab",
  "pyzmq>=25",
  "scipy",
  "numpy==1.26.4",
  "mediapy==1.2.6",
  "mujoco>=3.7.0.dev0,<3.9.0",
  "mujoco-warp",
]

[tool.uv]
package = true
constraint-dependencies = [
  "numpy==1.26.4",
  "mediapy==1.2.6",
  "mujoco>=3.7.0.dev0,<3.9.0",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "mujoco"
url = "https://py.mujoco.org/"
explicit = true

[tool.uv.sources]
mjlab = { git = "https://github.com/mujocolab/mjlab", tag = "v1.1.1" }
mujoco = { index = "mujoco" }
mujoco-warp = { git = "https://github.com/google-deepmind/mujoco_warp", rev = "fc9158989525538db53a2a8c3c0f156cbfeca911" }
warp-lang = { index = "nvidia", marker = "sys_platform != 'darwin'" }
torch = { index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
