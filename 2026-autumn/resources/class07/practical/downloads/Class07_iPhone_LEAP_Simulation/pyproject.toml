[project]
name = "class07-iphone-leap-simulation"
version = "1.0.0"
description = "Simulation-only Class 07 visual feedback and iPhone hand retargeting"
requires-python = ">=3.11,<3.13"
dependencies = [
  "asmagic==0.1.4",
  "dex-retargeting",
  "mediapipe>=0.10,<0.11",
  "mujoco>=3.3,<4",
  "numpy>=2,<3",
  "opencv-python>=4.10,<5",
  "six>=1.16,<2",
  "torch>=2.5,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false

[tool.uv.sources]
dex-retargeting = { path = "simulation/dex_retargeting", editable = true }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
