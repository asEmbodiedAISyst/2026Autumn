name: Course resources
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify checker failure cases
        run: python3 .github/scripts/check_course_resources.py --self-test
      - name: Verify course resources
        run: python3 .github/scripts/check_course_resources.py
